name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint + format check — platform-independent, so run once on Node 22.
  lint:
    name: lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  # Full check across the OSes and Node versions real users run on.
  # (vitest 4 needs Node >=20, so the test job stays on 20/22; the Node 18
  # runtime floor is smoke-tested separately below.)
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # The package declares engines.node >=18; verify the built CLI actually runs
  # on the Node 18 floor (vitest isn't run here — it requires Node 20+).
  runtime-node18:
    name: runtime smoke (node 18 floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: CLI runs on Node 18
        run: |
          node bin/tokenmix.js --version
          node bin/tokenmix.js list
