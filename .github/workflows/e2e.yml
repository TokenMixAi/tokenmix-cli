name: e2e

# Real end-to-end checks against the PUBLISHED package (what users actually get via npx),
# across the OSes/Node versions real users run on — including Windows, which the local QA
# could not cover. Requires the repo secret TOKENMIX_TEST_KEY.
#
# NOT run on pull_request: secrets are not exposed to fork PRs, and these tests hit the live
# gateway. Trigger manually (Actions tab → Run workflow) or automatically after a release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'tokenmix version to test (npm dist-tag or exact version)'
        default: 'latest'
  release:
    types: [published]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  TM_VERSION: ${{ github.event.inputs.version || 'latest' }}

jobs:
  # Gate every test job on the just-published version ACTUALLY being installable.
  # `release: published` fires before npm's CDN has propagated, so without this the
  # earliest-scheduled jobs hit "No matching version found" / login failure and go
  # red spuriously (it bit v0.4.10 and v0.4.11). Poll until it's live, then proceed.
  wait-for-publish:
    name: wait for npm to propagate
    runs-on: ubuntu-latest
    steps:
      - name: wait until the target version is installable
        shell: bash
        run: |
          VER="${{ github.event.inputs.version || github.event.release.tag_name || 'latest' }}"
          VER="${VER#v}"   # strip leading v from a release tag (v0.4.11 -> 0.4.11)
          if [ "$VER" = "latest" ]; then VER="$(npm view tokenmix@latest version)"; fi
          echo "Waiting for tokenmix@$VER to be installable on npm…"
          for i in $(seq 1 30); do
            if npm view "tokenmix@$VER" version >/dev/null 2>&1; then
              echo "✓ tokenmix@$VER is live"; exit 0
            fi
            echo "  ($i/30) not yet — sleeping 10s"; sleep 10
          done
          echo "✗ tokenmix@$VER never appeared after ~5 min"; exit 1

  # Core CLI surface that needs no agent install — fast, stable, full matrix.
  cli-core:
    name: cli-core (${{ matrix.os }}, node ${{ matrix.node }})
    needs: wait-for-publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: cli-core e2e
        shell: bash
        env:
          TOKENMIX_TEST_KEY: ${{ secrets.TOKENMIX_TEST_KEY }}
          TOKENMIX_DEFAULT_MODEL: qwen-flash   # e2e only checks the path works — use the cheapest model
        run: bash scripts/e2e/cli-core.sh

  agent-opencode:
    name: opencode (${{ matrix.os }})
    needs: wait-for-publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: opencode e2e
        shell: bash
        env:
          TOKENMIX_TEST_KEY: ${{ secrets.TOKENMIX_TEST_KEY }}
          TOKENMIX_DEFAULT_MODEL: qwen-flash
        run: bash scripts/e2e/agent-opencode.sh

  agent-claude:
    name: claude (${{ matrix.os }})
    needs: wait-for-publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: claude e2e
        shell: bash
        env:
          TOKENMIX_TEST_KEY: ${{ secrets.TOKENMIX_TEST_KEY }}
          TOKENMIX_DEFAULT_MODEL: claude-haiku-4.5   # claude agent = Anthropic messages, must be a claude model
        run: bash scripts/e2e/agent-claude.sh

  agent-aider:
    name: aider (${{ matrix.os }})
    needs: wait-for-publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: aider e2e
        shell: bash
        env:
          TOKENMIX_TEST_KEY: ${{ secrets.TOKENMIX_TEST_KEY }}
          TOKENMIX_DEFAULT_MODEL: qwen-flash
        run: bash scripts/e2e/agent-aider.sh

  # Codex & Qwen Code require Node 22+ (the CLI's minNode guard enforces this).
  agent-codex:
    name: codex (${{ matrix.os }})
    needs: wait-for-publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: codex e2e
        shell: bash
        env:
          TOKENMIX_TEST_KEY: ${{ secrets.TOKENMIX_TEST_KEY }}
          TOKENMIX_DEFAULT_MODEL: claude-haiku-4.5   # codex = Responses API; cheapest model that bridges there
        run: bash scripts/e2e/agent-codex.sh

  agent-qwen:
    name: qwen (${{ matrix.os }})
    needs: wait-for-publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: qwen e2e
        shell: bash
        env:
          TOKENMIX_TEST_KEY: ${{ secrets.TOKENMIX_TEST_KEY }}
          TOKENMIX_DEFAULT_MODEL: qwen-flash
        run: bash scripts/e2e/agent-qwen.sh

  # Goose installs via a curl script (not npm); linux/macos only (its Windows install differs).
  agent-goose:
    name: goose (${{ matrix.os }})
    needs: wait-for-publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: goose e2e
        shell: bash
        env:
          TOKENMIX_TEST_KEY: ${{ secrets.TOKENMIX_TEST_KEY }}
          TOKENMIX_DEFAULT_MODEL: qwen-flash
        run: bash scripts/e2e/agent-goose.sh

  # OpenHands is a Python tool (uv pulls Python 3.12); linux/macos only.
  agent-openhands:
    name: openhands (${{ matrix.os }})
    needs: wait-for-publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: openhands e2e
        shell: bash
        env:
          TOKENMIX_TEST_KEY: ${{ secrets.TOKENMIX_TEST_KEY }}
          TOKENMIX_DEFAULT_MODEL: qwen-flash
        run: bash scripts/e2e/agent-openhands.sh
